name: tekartik_app_agent_flutter
description: Flutter helpers for the apps an agent (an LLM, a test tool) drives - AgentId (stable semantics ids, the web flt-semantics-identifier), agentInit (semantics from ?semantics / ?agent, the commands exposed by a web js bridge and VM service extensions), AgentCommandsScope.
version: 0.2.1
homepage: https://github.com/tekartik/app_flutter_utils.dart
publish_to: none

environment:
  sdk: ^3.12.0
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  tekartik_app_agent:
    git:
      url: https://github.com/tekartik/app_common_utils.dart
      path: app_agent
    version: ">=0.3.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  material_ui: ">=1.5.0"
  tekartik_lints_flutter:
    git:
      url: https://github.com/tekartik/common_flutter.dart
      path: packages/lints_flutter

resolution: workspace
