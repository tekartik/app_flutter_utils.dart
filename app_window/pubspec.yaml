name: tekartik_app_flutter_window
description: The app window on Linux, macOS and Windows (size, minimum size, full screen, always on top, taskbar, title bar, events) behind one interface, window_manager underneath, so that apps never use window_manager directly.
version: 0.1.3
publish_to: none

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  # The native window on Linux, macOS and Windows (nativeapi), io only.
  window_manager: ">=0.6.0"
  # KvStore, where AppWindowSizeKeeper keeps the window size.
  tekartik_prefs:
    git:
      url: https://github.com/tekartik/prefs.dart
      path: prefs
    version: '>=2.0.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  tekartik_lints_flutter:
    git:
      url: https://github.com/tekartik/common_flutter.dart
      path: packages/lints_flutter
    version: '>=0.1.0'

flutter:
resolution: workspace
